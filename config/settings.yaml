# AirFareX - System Configuration Settings

app:
  name: "AirFareX - Indian Airfare Price Index"
  version: "1.0.0"
  demo_mode: true
  environment: "development"

database:
  db_type: "sqlite" # Fallback sqlite, supports "postgresql"
  sqlite_url: "sqlite:///./airfarex.db"
  postgres_url: "postgresql+asyncpg://postgres:postgres@localhost:5432/airfarex"

indexing:
  methodology_version: "APIX_v1"
  representative_price_metric: "median" # Options: median, trimmed_mean, weighted_mean
  trimmed_mean_cutoff: 0.10 # 10% trim top and bottom if trimmed_mean used
  base_period:
    days: 30
    mode: "relative_start" # Uses initial 30 days of dataset as P_i,0 baseline
    base_period_code: "2026-08-BASE30"
  lead_time_buckets: [1, 7, 15, 30, 45]

quality:
  outlier_method: "MAD" # Options: MAD, IQR, BOTH
  mad_threshold: 3.0
  iqr_multiplier: 1.5
  duplicate_check_fields:
    - "origin"
    - "destination"
    - "departure_date"
    - "carrier"
    - "flight_number"
    - "fare_class"
    - "source"
    - "observation_timestamp"

collector:
  default_provider: "mock_provider"
  concurrency_limit: 4
  request_timeout_seconds: 15

api:
  host: "0.0.0.0"
  port: 8000
  cors_origins:
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
