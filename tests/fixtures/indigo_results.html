<!DOCTYPE html>
<html>
<head><title>Flight Select - IndiGo</title></head>
<body>
<div class="booking-flow">
  <!-- Flight 1: Normal available flight with breakdown -->
  <div class="flight-card">
    <div class="flight-info">
      <span class="flight-number">6E-205</span>
      <span class="route">DEL to BOM</span>
      <span class="time">06:00 - 08:15</span>
      <span class="seats-left">4 seats left</span>
    </div>
    <div class="fare-options">
      <div class="fare-family">
        <span class="fare-name">Saver</span>
        <div class="base-fare">INR 4,200.00</div>
        <div class="taxes">INR 750.00</div>
        <div class="total-fare">INR 5,450.00</div>
      </div>
    </div>
  </div>

  <!-- Flight 2: Available flight with Flexi Plus and seats alert -->
  <div class="flight-card">
    <div class="flight-info">
      <span class="flight-number">6E-531</span>
      <span class="route">DEL to BOM</span>
      <span class="time">10:30 - 12:45</span>
      <span class="seats-left">2 seats remaining</span>
    </div>
    <div class="fare-options">
      <div class="fare-family">
        <span class="fare-name">Flexi Plus</span>
        <div class="total-fare">INR 6,890.00</div>
      </div>
    </div>
  </div>

  <!-- Flight 3: Sold out flight -->
  <div class="flight-card">
    <div class="flight-info">
      <span class="flight-number">6E-882</span>
      <span class="route">DEL to BOM</span>
      <span class="time">18:00 - 20:15</span>
    </div>
    <div class="fare-options">
      <div class="fare-sold-out">
        <span class="sold-out">Sold Out</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
