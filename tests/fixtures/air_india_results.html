<!DOCTYPE html>
<html>
<head><title>Flight Search Results - Air India</title></head>
<body>
<div class="flight-results-wrapper">
  <!-- Flight 1: Available Comfort with breakdown -->
  <div class="flight-card">
    <div class="flight-details">
      <span class="flight-number">AI-805</span>
      <span class="schedule">07:00 -> 09:15</span>
      <span class="seats-remaining">3 seats left at this price</span>
    </div>
    <div class="fare-selection">
      <div class="fare-tier">
        <span class="tier-name">Comfort</span>
        <div class="base-fare">₹ 4,500.00</div>
        <div class="taxes">₹ 820.00</div>
        <div class="price">₹ 5,820.00</div>
      </div>
    </div>
  </div>

  <!-- Flight 2: Available Comfort Plus -->
  <div class="flight-card">
    <div class="flight-details">
      <span class="flight-number">AI-887</span>
      <span class="schedule">14:00 -> 16:15</span>
    </div>
    <div class="fare-selection">
      <div class="fare-tier">
        <span class="tier-name">Comfort Plus</span>
        <div class="price">₹ 7,450.00</div>
      </div>
    </div>
  </div>

  <!-- Flight 3: Sold out -->
  <div class="flight-card">
    <div class="flight-details">
      <span class="flight-number">AI-506</span>
      <span class="schedule">21:00 -> 23:15</span>
    </div>
    <div class="fare-selection">
      <span class="not-available">Sold Out</span>
    </div>
  </div>
</div>
</body>
</html>
