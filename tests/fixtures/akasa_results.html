<!DOCTYPE html>
<html>
<head><title>Flight Booking - Akasa Air</title></head>
<body>
<div class="akasa-search-view">
  <!-- Flight 1: Available Saver -->
  <div class="akasa-flight-card">
    <div class="meta-section">
      <span class="flightCode">QP-1102</span>
      <span class="dur">06:45 -> 09:00</span>
      <span class="seatsLeft">4 seats left</span>
    </div>
    <div class="pricing-tier">
      <span class="fareType">Saver</span>
      <div class="base-fare">₹ 4,100.00</div>
      <div class="taxes">₹ 720.00</div>
      <div class="fare-amount">₹ 5,320.00</div>
    </div>
  </div>

  <!-- Flight 2: Available Flexi -->
  <div class="akasa-flight-card">
    <div class="meta-section">
      <span class="flightCode">QP-1355</span>
      <span class="dur">13:10 -> 15:25</span>
    </div>
    <div class="pricing-tier">
      <span class="fareType">Flexi</span>
      <div class="fare-amount">₹ 6,400.00</div>
    </div>
  </div>

  <!-- Flight 3: Sold out -->
  <div class="akasa-flight-card">
    <div class="meta-section">
      <span class="flightCode">QP-1406</span>
      <span class="dur">19:30 -> 21:45</span>
    </div>
    <div class="pricing-tier">
      <span class="soldOut">Sold Out</span>
    </div>
  </div>
</div>
</body>
</html>
